name: Test Godot project
description: Run the test Godot project.

inputs:
  bin:
    description: The path to the Godot executable
    required: true

runs:
  using: composite
  steps:
    # Keep the upstream fixture separate from the fork's existing test_project demo.
    - name: Download test project
      id: fixture
      shell: bash
      run: |
        fixture_dir=$(mktemp -d "$RUNNER_TEMP/godot-regression.XXXXXX")
        wget -q https://github.com/godotengine/regression-test-project/archive/4.0.zip -O "$fixture_dir/project.zip"
        unzip -q "$fixture_dir/project.zip" -d "$fixture_dir"
        echo "path=$fixture_dir/regression-test-project-4.0" >> "$GITHUB_OUTPUT"

    # Editor is quite complicated piece of software, so it is easy to introduce bug here.

    - name: Open and close editor (Vulkan)
      shell: bash
      run: |
        set -o pipefail
        status=0
        timeout --kill-after=10s 5m xvfb-run ${{ inputs.bin }} --audio-driver Dummy --editor --quit --path "${{ steps.fixture.outputs.path }}" 2>&1 | tee sanitizers_log.txt || status=$?
        test "$status" -ne 124 && test "$status" -ne 137
        misc/scripts/check_ci_log.py sanitizers_log.txt

    - name: Open and close editor (GLES3)
      shell: bash
      run: |
        set -o pipefail
        status=0
        DRI_PRIME=0 timeout --kill-after=10s 5m xvfb-run ${{ inputs.bin }} --audio-driver Dummy --rendering-driver opengl3 --editor --quit --path "${{ steps.fixture.outputs.path }}" 2>&1 | tee sanitizers_log.txt || status=$?
        test "$status" -ne 124 && test "$status" -ne 137
        misc/scripts/check_ci_log.py sanitizers_log.txt

    # Run test project
    - name: Run project
      shell: bash
      run: |
        set -o pipefail
        status=0
        timeout --kill-after=10s 5m xvfb-run ${{ inputs.bin }} 40 --audio-driver Dummy --path "${{ steps.fixture.outputs.path }}" 2>&1 | tee sanitizers_log.txt || status=$?
        test "$status" -ne 124 && test "$status" -ne 137
        misc/scripts/check_ci_log.py sanitizers_log.txt
        grep -Fq "######################## Ending test ########################" sanitizers_log.txt

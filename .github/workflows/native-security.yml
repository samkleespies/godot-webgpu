name: Native security regressions
on:
  pull_request:
  push:
    branches: [webgpu-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ide-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/dotnet/ide_logging/ide_logging.csproj --configuration Release

  sanitizers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Check native memory and file mapping regressions
        run: |
          clang++ -std=c++17 -fsanitize=address,undefined -g -I thirdparty/vhacd/inc tests/thirdparty/test_vhacd_sarray.cpp -o /tmp/test-vhacd
          /tmp/test-vhacd
          clang++ -std=c++17 -fsanitize=address,undefined -g -DU_STATIC_IMPLEMENTATION -DU_COMMON_IMPLEMENTATION -I thirdparty/icu4c/common tests/thirdparty/test_icu_map.cpp -o /tmp/test-icu-map
          /tmp/test-icu-map
